# Runs the zstd-kit and lfc-pack Node pass/fail suites when either changes (lfc-pack embeds zstd-kit's WebAssembly). No speed numbers, no browsers.
# The lfc-pack suite includes the Python reader and writer checks: Python 3.12 with the zstandard package is installed, and the job fails if any check reports itself skipped (owner rule: no skipped tests).
# Cost: about 30 seconds per run (the suite takes under a minute; most of the rest is runner start and checkout).
name: lfc-pack-tests
on:
  pull_request:
    paths:
      - 'modules/lfc-pack/**'
      - 'modules/zstd-kit/**'
      - '.github/workflows/lfc-pack-tests.yml'
  push:
    branches: [main]
    paths:
      - 'modules/lfc-pack/**'
      - 'modules/zstd-kit/**'
      - '.github/workflows/lfc-pack-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: node modules/zstd-kit/test/run.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet zstandard==0.25.0 && python -c "import zstandard"
      - name: lfc-pack suite (fails on any skipped check)
        shell: bash
        run: |
          set -o pipefail
          node modules/lfc-pack/test/run.js | tee lfc-pack-tests.txt
          if grep -i 'skipped' lfc-pack-tests.txt; then echo "a check was skipped"; exit 1; fi
