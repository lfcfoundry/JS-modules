# Runs the Node pass/fail suite of every module a pull request changes (lfc-pack and zstd-kit have their own workflow, lfc-pack-tests). No speed numbers, no browsers.
# It runs the steps of tests/kits.js whose name starts with a changed module's name (a module with no step is skipped, and the step list is the place to add one).
# Cost: a few seconds to about 20 seconds per changed module, plus runner start and checkout.
# The WebAssembly rebuild checks (build.sh --check) compare bytes, so they need the exact compiler the shipped files came from: clang 18.1.3 (Ubuntu 1ubuntu1)
# with wasm-ld 18. The job runs on ubuntu-24.04, where that is the system clang, and stops if the version is anything else instead of skipping the check.
name: module-tests
on:
  pull_request:
    paths:
      - 'modules/**'
      - 'tests/kits.js'
      - '.github/workflows/module-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Use clang 18.1.3 and wasm-ld 18 (the byte-identical WebAssembly rebuild checks need this exact compiler)
        run: |
          if ! command -v clang-18 >/dev/null || ! command -v wasm-ld-18 >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq clang-18 lld-18; fi
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
          /usr/lib/llvm-18/bin/clang --version | head -1
          /usr/lib/llvm-18/bin/clang --version | head -1 | grep -q 'clang version 18.1.3' || { echo "expected clang 18.1.3"; exit 1; }
          /usr/lib/llvm-18/bin/wasm-ld --version
      - name: Run the suites of the changed modules
        run: |
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          changed=$(echo "$files" | grep '^modules/' | cut -d/ -f2 | sort -u | grep -v -x -e lfc-pack -e zstd-kit || true)
          # a change to this workflow (the compiler setup) also runs every module whose suite rebuilds its WebAssembly byte for byte
          if echo "$files" | grep -qx '.github/workflows/module-tests.yml'; then changed=$(printf '%s\n' $changed gif-writer gpu-blur netflow-sankey sprite-baker stage-curtains zip-open | sort -u); fi
          if [ -z "$changed" ]; then echo "no module with its own suite changed"; exit 0; fi
          re=$(echo "$changed" | paste -sd'|' -)
          echo "modules: $re"
          node tests/kits.js --quick --only "^($re)( |\$)"
