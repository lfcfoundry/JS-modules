# Publishes the site to GitHub Pages. Deploys run one at a time and queue, so two merges close together
# no longer cancel each other (the built-in Pages deploy drops the older run). The site is plain files:
# there is no _config.yml, no front matter and no underscore folder, so this uploads exactly what Jekyll served.
# Needs Settings > Pages > Source set to "GitHub Actions".
name: pages-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
