<script>window.addEventListener("error",function(e){window.__res={error:String(e.message)}});window.addEventListener("unhandledrejection",function(e){window.__res={error:String(e.reason&&e.reason.stack||e.reason)}});</script>
<script src="/r/modules/core-plan/core-plan.js"></script><script src="/r/modules/text-columns/text-columns.js"></script><script src="/r/modules/graph-walk/graph-walk.js"></script><script src="/r/modules/lfc-pack/lfc-pack.js"></script><script>
// The modules' default helper counts follow core-plan, and the default (no count given) parallel calls give the same answers as one thread.
// Run with tests/bench-page.js. Copyright (c) 2026 LFC Foundry. MIT License.
(async function () {
  var plan = LfcCorePlan.plan(), out = { plan: plan.label, checks: [] }, seed = 7, r = function () { return (seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296; };
  function ok(name, c) { out.checks.push((c ? 'ok   ' : 'FAIL ') + name); }
  var full = LfcCorePlan.plan({ keepFree: 0 }).workers;
  // text-columns: warm() with no count starts one helper per real core (the page waits while they parse)
  ok('text-columns warm() starts ' + full + ' helpers', TextColumns.warm() === full);
  var L = ['id,price,city'], i; for (i = 0; i < 200000; i++) L.push(i + ',' + (r() * 1000).toFixed(2) + ',city' + Math.floor(r() * 300));

  var sum = function (t) { var s = 0, c = t.columns[1].values; for (i = 0; i < c.length; i++) s += c[i]; return t.count + ':' + s.toFixed(2) + ':' + t.columns[2].values[t.count - 1]; };
  ok('text-columns parseParallel default: ' + p.workers + ' helpers, same table', p.workers === full && sum(a) === sum(p));
  TextColumns.closeHelpers();

  var n = 3000, fr = [], to = []; for (i = 1; i < n; i++) { fr.push(Math.floor(r() * i)); to.push(i); } for (i = 0; i < 3000; i++) { fr.push(Math.floor(r() * n)); to.push(Math.floor(r() * n)); }
  var g = GraphWalk.csr(n, Int32Array.from(fr), Int32Array.from(to)); if (GraphWalk.ready) await GraphWalk.ready();
  var b1 = GraphWalk.betweenness(g), b2 = await GraphWalk.betweennessAsync(g, { minWork: 0 }), d = 0; for (i = 0; i < n; i++) d = Math.max(d, Math.abs(b1[i] - b2[i]));
  ok('graph-walk betweennessAsync default gives the one-thread values (largest gap ' + d.toExponential(1) + ')', d < 1e-6);
  // lfc-pack: packParallel with no count, same file bytes as pack()
  await LfcPack.init();
  var J = []; for (i = 0; i < 60000; i++) J.push(JSON.stringify({ id: i, v: Math.round(r() * 1e6) / 100, s: 'k' + Math.floor(r() * 500) })); var nd = new TextEncoder().encode(J.join('\n') + '\n');
  var f1 = LfcPack.pack(nd), f2 = await LfcPack.packParallel(nd, { blockBytes: 1 << 20 }), f1b = LfcPack.pack(nd, { blockBytes: 1 << 20 }), same = f2.length === f1b.length;
  for (i = 0; same && i < f2.length; i++) if (f2[i] !== f1b[i]) same = false;
  ok('lfc-pack packParallel default: same bytes as pack (' + f2.length + ' bytes)', same);
  out.ok = out.checks.every(function (c) { return c.indexOf('ok') === 0; });
  LfcCorePlan.lastRun.done(); window.__res = out;
})();
