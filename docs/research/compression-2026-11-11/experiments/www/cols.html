async function run() { await LfcPack.init(); const b = new Uint8Array(await (await fetch('eq/' + __h[1] + '.lfc')).arrayBuffer()), o = {};
  for (const [k, f] of [['cols', () => LfcPack.unpackColumns(b)], ['rows', () => LfcPack.unpack(b)]]) { let t = performance.now(); f(); o[k + 'First'] = +(performance.now() - t).toFixed(2); const xs = []; for (let i = 0; i < 5; i++) { t = performance.now(); f(); xs.push(performance.now() - t); } xs.sort((a, c) => a - c); o[k] = +xs[2].toFixed(2); }
