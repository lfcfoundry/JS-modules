<title>ppmd-pack example</title>
<style>
body{font:16px/1.55 'Segoe UI',system-ui,sans-serif;margin:0;color:#1b2433;background:#fff}
@media(prefers-color-scheme:dark){body{color:#e4ebf5;background:#0b1522}a{color:#4c9bf5}}
body>*{margin-left:2rem;margin-right:2rem;max-width:34rem}
h1{margin:0 0 1rem;padding:14px 2rem;max-width:none;background:#0f2a47;color:#f3f7fc;font-size:1.25rem;line-height:1.2}
button{font:inherit;font-weight:600;padding:.45rem .9rem;border-radius:6px;border:1px solid #9db0c8;background:#f1f4f9;color:#1b2433;cursor:pointer}
</style>
<body>
<h1 id="h">Hello from a packed page</h1>
<p>This page was stored PPMd-compressed inside <code>packed-bytes.html</code> (or <code>packed-base64.html</code>), unpacked by a small decoder, and written into the browser. Unicode survives the trip: caf&eacute; &#9731; &#127820; &mdash; &ldquo;quotes&rdquo;.</p>
<button id="b">Count clicks: 0</button>
<script>
var n = 0, b = document.getElementById('b');
b.onclick = function () { b.textContent = 'Count clicks: ' + (++n); };
document.title = 'unpacked ok';
// some repeated text so there is something to compress:
var filler = '<!-- ' + new Array(200).join('lorem ipsum dolor sit amet ') + ' -->';
</script>
