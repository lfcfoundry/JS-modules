<meta charset="utf-8"><title>test-isolation property-style probes</title>
<script src="../test-isolation.js"></script>
<script>
// Seven things a real Storage does that the 1.0.0 wrapper got wrong; the answer is left in window.__result.
var REAL = window.localStorage, P = 'iso:', r = {};
function safe(f) { try { return f(); } catch (e) { return 'THROWS ' + (e && e.name); } }
REAL.clear(); REAL.setItem('save', 'REAL'); REAL.setItem('other', 'REAL2');
var ls = TestIsolation.wrap(REAL, P);
ls.setItem('a', '1');
r.objectKeys = safe(function () { return JSON.stringify(Object.keys(ls)); });                    // want ["a"]
r.inOperator = safe(function () { return ('a' in ls) + '/' + ('save' in ls); });                  // want true/false
r.jsonStringify = safe(function () { return JSON.stringify(ls); });                                // want {"a":"1"}
r.propertyRead = safe(function () { return String(ls.a); });                                       // want 1
r.propertyWrite = safe(function () { ls.b = '2'; return 'getItem=' + ls.getItem('b') + ' stored=' + REAL.getItem(P + 'b'); });   // want getItem=2 stored=2
r.propertyDelete = safe(function () { delete ls.a; return 'after delete getItem=' + ls.getItem('a'); });   // want null
r.length = safe(function () { return ls.length; });                                                // want 1 (only b)
ls.clear();
r.realUntouched = REAL.getItem('save') === 'REAL' && REAL.getItem('other') === 'REAL2';
REAL.clear(); window.__result = r;
</script>
