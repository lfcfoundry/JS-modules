<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Cartoon 3D style kit demo</title>
<style>
/* 1. TOKENS ---------------------------------------------------------- */
:root{
  --bg:#edf1f2; --panel:#fbfcfc; --fg:#162226; --muted:#55656b; --line:#d0dadd;
  --sk-hi:#e6685b; --sk-mid:#c4372c; --sk-lo:#86231b; --sk-glow:#c4372c; --stem:#5b3f27; --leaf:#3f7d4c;
  --sky-top:#b5d6e8; --sky-bot:#eef5f1; --hill-far:#b3cdc0; --hill-mid:#90b9a1; --ground:#6aa282;
  --trunk:#6b4a2f; --foliage:#3f7d4c; --foliage-2:#5ca06a; --bld:#ece6d9; --bld-2:#c6bba9; --roof:#a8473a; --win:#ffd98a;
  color-scheme:only light;             /* stops phone "force dark" from repainting the white shines dark (see guide, section 5.4) */
  --sk-label:#fff; --sk-label-shadow:0 1px 2px rgba(0,0,0,.3);
  --ink:#2a120d;                      /* "black" for faces and outlines: a warm dark brown, never #000 */
  --display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--body);padding:1rem}
.demo{max-width:26rem;margin:0 auto;display:grid;gap:1rem}
h2{margin:.2rem 0 0;font:700 .8rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* 2. THE STAGE: scene + character + soft ground shadow -------------------- */
.stage{position:relative;isolation:isolate;display:flex;justify-content:center;padding-block:1.7rem 2.9rem;border:1px solid var(--line);border-radius:12px;overflow:hidden;--aw:min(54vw,12rem);user-select:none}
.scene{position:absolute;inset:0;z-index:0;pointer-events:none}
.scene svg{display:block;width:100%;height:100%;transform:scale(1.05)}
.c-hillf{fill:var(--hill-far)}.c-hillm{fill:var(--hill-mid)}.c-grd{fill:var(--ground)}
.c-trunk{fill:var(--trunk)}.c-fol{fill:var(--foliage)}.c-fol2{fill:var(--foliage-2)}.c-apl{fill:#d63a2e}.c-white{fill:#fff}
.c-bld{fill:var(--bld)}.c-bld2{fill:var(--bld-2)}.c-roof{fill:var(--roof)}.c-win{fill:var(--win)}

.hero{--heat:0;position:relative;z-index:2;display:block;width:var(--aw);aspect-ratio:1;padding:0;border:0;border-radius:50%;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.aura{position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle,var(--sk-glow) 0,transparent 66%);opacity:.22;animation:aura 3.2s ease-in-out infinite;pointer-events:none}
.ground{position:absolute;left:20%;right:20%;bottom:1%;height:6%;border-radius:50%;background:rgba(0,0,0,.26);filter:blur(3px);pointer-events:none}
.bob{position:absolute;inset:0;display:block;animation:bob 3.4s ease-in-out infinite;pointer-events:none}
.art{display:block;width:100%;height:100%;transform-origin:50% 90%;animation:wiggle 9s ease-in-out 3s infinite}
.a-stem{stroke:var(--stem);fill:none}.a-leaf{fill:var(--leaf)}
.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.6s infinite}
.pupils{transition:transform 90ms ease-out}
.face .cheek{fill:#ff6f86;opacity:.42}
.face .eye-w{fill:#fff;stroke:var(--ink);stroke-width:2.2}
.face .pupil{fill:#1d1410}.face .glintp{fill:#fff}
.face .mouth{stroke:var(--ink);stroke-width:4.5;stroke-linecap:round;fill:none}
.label{position:absolute;left:0;right:0;top:100%;margin-top:.15rem;text-align:center;font:800 1.05rem/1 var(--display);color:var(--sk-label);pointer-events:none}
.label span{display:inline-block;padding:.3rem .95rem .35rem;border-radius:999px;background:var(--sk-mid);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.18),0 0 14px rgba(0,0,0,.2);   /* fallback without color-mix() */
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.18),0 0 14px color-mix(in srgb,var(--sk-glow) 50%,transparent);text-shadow:var(--sk-label-shadow)}
.ring{position:absolute;inset:6%;border-radius:50%;border:4px solid var(--sk-glow);pointer-events:none}
.pop{position:absolute;z-index:4;pointer-events:none;white-space:nowrap;font:800 1.9rem/1 var(--display);color:var(--sk-glow);
  text-shadow:-2px 0 var(--bg),2px 0 var(--bg),0 -2px var(--bg),0 2px var(--bg),-2px -2px var(--bg),2px 2px var(--bg),-2px 2px var(--bg),2px -2px var(--bg),0 0 16px var(--sk-glow)}
.bit{position:absolute;z-index:3;pointer-events:none;border-radius:50%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes aura{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes wiggle{0%,86%,100%{transform:rotate(0)}88%{transform:rotate(-5deg)}90%{transform:rotate(5deg)}92%{transform:rotate(-3deg)}94%{transform:rotate(2deg)}}

/* 3. LOGO LOCKUP ------------------------------------------------------------ */
.logo{display:flex;align-items:center;gap:0;margin:0;font-family:var(--display);line-height:1;letter-spacing:-.02em;white-space:nowrap;justify-content:center;padding:.6rem 0}
.logo-hero{width:6.2rem;height:auto;flex:none;margin-inline:-.35rem -1.1rem;position:relative;z-index:1;overflow:visible;filter:drop-shadow(0 4px 0 rgba(0,0,0,.16))}
.logo-words{position:relative;display:flex;flex-direction:column;align-items:flex-start;padding-block-start:.1rem}
.logo-1{position:relative;display:block;font-weight:800;font-size:3.2rem;line-height:.92;padding-inline:.06em .1em;color:transparent;transform:rotate(-2deg);transform-origin:0 100%;filter:drop-shadow(0 .05em 0 #7a120d) drop-shadow(0 .1em .07em rgba(0,0,0,.28))}
.logo-1::before,.logo-1::after{content:attr(data-t);position:absolute;left:0;top:0;padding-inline:inherit;white-space:nowrap}
.logo-1::before{color:#fff7e3;text-shadow:var(--stroke)}   /* cream sticker outline: ring of 0-blur shadows, filled in by the script below */
.logo-1::after{background:linear-gradient(180deg,#ff9a7c 0%,#e8392d 45%,#a3150f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.logo-2{position:relative;margin:.2rem 0 0 .5rem;padding:.1em .7em .16em;font-weight:800;font-size:1.35rem;letter-spacing:.2em;text-transform:uppercase;color:#fff;background:linear-gradient(180deg,#62c981,#2c8a49);border-radius:.35em;box-shadow:0 .12em 0 #1b5c32,0 .3em .5em rgba(0,0,0,.22),inset 0 .08em 0 rgba(255,255,255,.35);text-shadow:0 .06em 0 rgba(0,0,0,.28);transform:rotate(-2deg)}
.logo-2::after{content:"";position:absolute;right:-.45em;top:-.5em;width:1em;height:.52em;border-radius:0 100% 0 100%;background:linear-gradient(135deg,#8be3a0,#2c8a49);box-shadow:0 .06em 0 #1b5c32;transform:rotate(-24deg)}
/* 4. SYSTEM SETTINGS: only change anything when the person's system asks (guide, section 5.4) */
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pupils{transition:none}}
@media (forced-colors:active){
  .stage,.logo-hero{forced-color-adjust:none}                 /* the scene and character keep their painted colors */
  .stage{border-color:CanvasText}
  .logo-1{color:CanvasText;filter:none}                       /* show the real text, drop the two decorated copies */
  .logo-1::before,.logo-1::after{content:none}
  .logo-2{border:2px solid CanvasText;box-shadow:none;text-shadow:none}
  .logo-2::after{display:none}
}
</style></head>
<body><div class="demo">

<h2>Logo lockup</h2>
<h1 class="logo" aria-label="Bloop Press">
  <svg class="logo-hero" viewBox="0 0 100 100" aria-hidden="true">
    <defs>
      <radialGradient id="lgBody" cx="36%" cy="30%" r="82%"><stop offset="0" stop-color="#ff8f78"/><stop offset=".45" stop-color="#e2342a"/><stop offset="1" stop-color="#8f120d"/></radialGradient>
      <linearGradient id="lgLeaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fd68f"/><stop offset="1" stop-color="#2f8f4c"/></linearGradient>
    </defs>
    <ellipse cx="50" cy="93" rx="24" ry="4" opacity=".16"/>
    <path d="M50 28c26 0 38 20 38 40 0 18-14 26-38 26S12 86 12 68c0-20 12-40 38-40Z" fill="url(#lgBody)" stroke="#fff7e3" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M50 30c-1-8 1-14 5-19" stroke="#6b3f1d" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <path d="M54 19c6-11 20-11 26-6-6 9-18 11-26 6Z" fill="url(#lgLeaf)" stroke="#fff7e3" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="31" cy="46" rx="6" ry="13" transform="rotate(14 31 46)" fill="#fff" opacity=".5"/>
    <circle cx="39" cy="55" r="3.4" fill="#2a120d"/><circle cx="61" cy="55" r="3.4" fill="#2a120d"/>
    <circle cx="40.2" cy="53.8" r="1.1" fill="#fff"/><circle cx="62.2" cy="53.8" r="1.1" fill="#fff"/>
    <ellipse cx="31" cy="64" rx="4.5" ry="2.6" fill="#ff6f86" opacity=".5"/><ellipse cx="69" cy="64" rx="4.5" ry="2.6" fill="#ff6f86" opacity=".5"/>
    <path d="M43 66q7 7 14 0" stroke="#2a120d" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  </svg>
  <span class="logo-words"><span class="logo-1" data-t="Bloop">Bloop</span><span class="logo-2">Press</span></span>
</h1>

<h2>Character on a scene (tap the character)</h2>
<div class="stage" id="stage">
  <div class="scene" aria-hidden="true">
    <svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMax slice">
      <defs>
        <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky-top)"/><stop offset="1" style="stop-color:var(--sky-bot)"/></linearGradient>
        <radialGradient id="gVig" cx="50%" cy="45%" r="75%"><stop offset=".6" stop-opacity="0"/><stop offset="1" stop-opacity=".2"/></radialGradient>
      </defs>
      <rect width="400" height="260" fill="url(#gSky)"/>
      <g transform="translate(342 34)"><circle r="24" fill="#ffd98a" opacity=".3"/><circle r="14" fill="#ffe08a"/><circle r="10" fill="#fff3c4"/></g>
      <g class="c-white"><g transform="translate(70 40)"><ellipse rx="24" ry="7"/><circle cx="-9" cy="-5" r="8"/><circle cx="7" cy="-8" r="10"/></g>
      <g transform="translate(250 70)" opacity=".7"><ellipse rx="19" ry="5.5"/><circle cx="-7" cy="-4" r="6"/><circle cx="6" cy="-6" r="8"/></g></g>
      <path class="c-hillf" d="M0 190c40-30 90-40 140-14 50-26 110-26 160-4 40-22 80-12 100 8v80H0Z"/>
      <path class="c-hillm" d="M0 200c60-18 120-14 180-2 60-14 140-12 220 0v62H0Z"/>
      <rect class="c-grd" y="204" width="400" height="56"/>
      <rect class="c-bld" x="12" y="164" width="50" height="40"/><polygon class="c-roof" points="6,165 37,138 68,165"/>
      <rect class="c-win" x="17" y="172" width="9" height="9"/><rect class="c-win" x="48" y="172" width="9" height="9"/><rect class="c-trunk" x="31" y="182" width="12" height="22"/>
      <rect class="c-trunk" x="336" y="172" width="6" height="32"/><circle class="c-fol" cx="339" cy="160" r="21"/><circle class="c-fol2" cx="331" cy="154" r="11"/>
      <circle class="c-apl" cx="347" cy="166" r="3"/><circle class="c-apl" cx="329" cy="168" r="3"/><circle class="c-apl" cx="341" cy="150" r="3"/>
      <rect class="c-trunk" x="372" y="184" width="5" height="20"/><circle class="c-fol" cx="374" cy="175" r="14"/><circle class="c-fol2" cx="369" cy="171" r="7"/>
      <rect width="400" height="260" fill="url(#gVig)"/>
    </svg>
  </div>
  <button class="hero" id="hero" type="button" aria-label="Press the character">
    <span class="aura"></span><span class="ground"></span>
    <span class="bob"><span style="display:block;width:100%;height:100%">
    <svg class="art" id="art" viewBox="0 0 200 200" focusable="false">
      <defs>
        <radialGradient id="gBody" cx="36%" cy="30%" r="82%"><stop offset="0" style="stop-color:var(--sk-hi)"/><stop offset=".5" style="stop-color:var(--sk-mid)"/><stop offset="1" style="stop-color:var(--sk-lo)"/></radialGradient>
        <radialGradient id="gShade" cx="72%" cy="88%" r="62%"><stop offset="0" stop-opacity=".4"/><stop offset="1" stop-opacity="0"/></radialGradient>
        <linearGradient id="gShine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <radialGradient id="gRim" cx="70%" cy="50%" r="60%"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <clipPath id="bodyClip"><path d="M100 50c40 0 70 30 70 72 0 30-26 54-70 54s-70-24-70-54c0-42 30-72 70-72Z"/></clipPath>
      </defs>
      <path d="M100 50c40 0 70 30 70 72 0 30-26 54-70 54s-70-24-70-54c0-42 30-72 70-72Z" fill="url(#gBody)"/>
      <g clip-path="url(#bodyClip)">
        <rect width="200" height="200" fill="url(#gShade)"/>
        <ellipse cx="158" cy="122" rx="14" ry="44" transform="rotate(-14 158 122)" fill="url(#gRim)"/>
      </g>
      <ellipse cx="62" cy="92" rx="12" ry="27" transform="rotate(16 62 92)" fill="url(#gShine)" opacity=".7"/>
      <circle cx="56" cy="62" r="4.5" fill="#fff" opacity=".8"/>
      <g class="face">
        <ellipse class="cheek" cx="60" cy="126" rx="9" ry="5.5"/><ellipse class="cheek" cx="140" cy="126" rx="9" ry="5.5"/>
        <g class="eyes"><ellipse class="eye-w" cx="79" cy="104" rx="11" ry="13"/><ellipse class="eye-w" cx="121" cy="104" rx="11" ry="13"/>
          <g class="pupils" id="pupils"><circle class="pupil" cx="79" cy="106" r="6.4"/><circle class="pupil" cx="121" cy="106" r="6.4"/><circle class="glintp" cx="81.6" cy="103" r="2.3"/><circle class="glintp" cx="123.6" cy="103" r="2.3"/></g></g>
        <path class="mouth" d="M85 134q15 14 30 0"/>
      </g>
      <path class="a-stem" d="M100 52q-1.5-21 12-36" stroke-width="7" stroke-linecap="round"/>
      <path class="a-leaf" d="M106 32c12-22 42-24 54-12-10 18-36 24-54 12Z"/>
    </svg></span></span>
    <span class="label"><span>Press</span></span>
  </button>
</div>

<h2>Skins: change four colors, get a new look</h2>
<div style="display:flex;gap:.6rem;flex-wrap:wrap">
  <button data-skin="red" class="sk">Red</button><button data-skin="gold" class="sk">Gold</button><button data-skin="violet" class="sk">Violet</button><button data-skin="ice" class="sk">Ice</button>
</div>
</div>
<script>
// logo outline: a ring of 0-blur text-shadows (48 offsets: 3 rings of 16) makes a smooth cream sticker edge
(function(){var o=[];[.05,.075,.098].forEach(function(r){for(var i=0;i<16;i++){var a=i/16*2*Math.PI;o.push((Math.cos(a)*r).toFixed(3)+'em '+(Math.sin(a)*r).toFixed(3)+'em 0 #fff7e3')}});
document.documentElement.style.setProperty('--stroke',o.join(','))})();
var hero=document.getElementById('hero'),art=document.getElementById('art'),stage=document.getElementById('stage'),pupils=document.getElementById('pupils');
function mk(c){var e=document.createElement('span');e.className=c;return e}
// calm mode: the system "reduce motion" setting is asked on every tap, so a change takes effect without a reload (guide, section 5.4)
var calmQuery=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):null;
function calm(){return !!(calmQuery&&calmQuery.matches)}
hero.addEventListener('click',function(e){
  if(calm())return;   // skips squash, pop number, confetti and ring (all element.animate() calls)
  var r=stage.getBoundingClientRect(),ab=hero.getBoundingClientRect();
  // a keyboard click (Enter or Space) has no pointer position: start from the middle of the button
  var kb=e.detail===0,px=kb?ab.left+ab.width/2:e.clientX,py=kb?ab.top+ab.height/2:e.clientY,x=px-r.left,y=py-r.top;
  var tilt=Math.max(-1,Math.min(1,(px-(ab.left+ab.width/2))/(ab.width/2)))*7;
  art.animate([{transform:'rotate(0deg) scale(1,1)'},{transform:'rotate('+tilt.toFixed(1)+'deg) scale(1.09,0.88)',offset:.28},{transform:'rotate('+(-tilt*.35).toFixed(1)+'deg) scale(0.96,1.07)',offset:.62},{transform:'rotate(0deg) scale(1,1)'}],{duration:300,easing:'ease-out'});
  var p=mk('pop');p.textContent='+1';p.style.left=(x+Math.random()*28-14)+'px';p.style.top=y+'px';stage.appendChild(p);var rot=Math.random()*24-12;
  p.animate([{transform:'translate(-50%,-50%) scale(.3) rotate('+rot+'deg)',opacity:0},{transform:'translate(-50%,-75%) scale(1.5) rotate('+rot+'deg)',opacity:1,offset:.18},{transform:'translate(-50%,-105%) scale(1) rotate('+rot*.4+'deg)',opacity:1,offset:.42},{transform:'translate(-50%,-300%) scale(.85)',opacity:0}],{duration:950,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=function(){p.remove()};
  var cols=['#e2564a','#f08a7e','#6cb27b'];
  for(var i=0;i<10;i++){var k=i%3,s=4+Math.random()*6,b=mk('bit');var w=s,h=s,rad='50%',bg=cols[Math.floor(i/3)%3];
    if(k===0){w=s*.75;h=s*1.25;rad='50% 50% 50% 50% / 62% 62% 38% 38%'}else if(k===1){w=s*1.2;h=s*.75;rad='2px';bg='#fff3cf'}else{w=3.2;h=5.6;bg='#4a2c18'}
    b.style.cssText='left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;border-radius:'+rad+';background:'+bg;stage.appendChild(b);
    var a=Math.random()*Math.PI*2,dx=Math.cos(a)*74*(.45+Math.random()*.8),up=-(26+Math.random()*74*.85),dn=30+Math.random()*56,ro=Math.random()*540-270;
    b.animate([{transform:'translate(-50%,-50%) rotate(0) scale(1)',opacity:1,easing:'cubic-bezier(.2,.7,.4,1)'},{transform:'translate(calc(-50% + '+dx*.6+'px),calc(-50% + '+up+'px)) rotate('+ro/2+'deg)',opacity:1,offset:.4,easing:'ease-in'},{transform:'translate(calc(-50% + '+dx*1.3+'px),calc(-50% + '+dn+'px)) rotate('+ro+'deg) scale(.5)',opacity:0}],{duration:650+Math.random()*450}).onfinish=(function(b){return function(){b.remove()}})(b)}
  var rg=mk('ring');hero.appendChild(rg);rg.animate([{transform:'scale(.75)',opacity:.85},{transform:'scale(1.7)',opacity:0}],{duration:520,easing:'ease-out'}).onfinish=function(){rg.remove()};
});
document.addEventListener('pointermove',function(e){if(calm()){pupils.style.transform='';return}   // pupils stay centered in calm mode
  var r=hero.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height*.52),d=Math.sqrt(dx*dx+dy*dy)||1,k=Math.min(1,d/140);
  pupils.style.transform='translate('+(dx/d*4.6*k).toFixed(2)+'px,'+(dy/d*4.6*k).toFixed(2)+'px)'});
// each skin: [hi, mid, lo, glow, label]. The label is the text color on top of mid; light skins get warm ink so it stays at 4.5:1 or better (test/run.js checks this list)
var SK={red:['#e6685b','#c4372c','#86231b','#c4372c','#ffffff'],gold:['#fff3b0','#f2b705','#a86a00','#ffd23f','#2a120d'],violet:['#c8b6ff','#5b3bd1','#1d0f5c','#7dd3fc','#ffffff'],ice:['#ffffff','#35c7e0','#0b3a63','#7df9ff','#2a120d']};
[].forEach.call(document.querySelectorAll('.sk'),function(b){b.style.cssText='padding:.4rem .9rem;border-radius:999px;border:1px solid var(--line);background:var(--panel);font:700 .85rem var(--body);cursor:pointer';
  b.onclick=function(){var v=SK[b.dataset.skin],s=document.documentElement.style;s.setProperty('--sk-hi',v[0]);s.setProperty('--sk-mid',v[1]);s.setProperty('--sk-lo',v[2]);s.setProperty('--sk-glow',v[3]);s.setProperty('--sk-label',v[4]);
    s.setProperty('--sk-label-shadow',v[4]==='#ffffff'?'0 1px 2px rgba(0,0,0,.3)':'0 1px 0 rgba(255,255,255,.35)')}});
</script><footer style="margin:1.5rem 0 .5rem;text-align:center;font:12px/1.3 system-ui,sans-serif;opacity:.7">Forged by <a href="https://github.com/JNFoo" target="_blank" rel="noopener noreferrer" style="color:inherit">LFC Foundry</a> • MIT Licensed</footer>
</body></html>
