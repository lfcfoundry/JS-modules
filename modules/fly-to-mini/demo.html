<title>fly-to-mini demo</title>
<style>
  body{margin:0;font:16px system-ui,sans-serif;height:300vh;background:linear-gradient(#cfe8f5,#fff)}
  #bar{position:sticky;top:0;height:56px;background:#fff;border-bottom:1px solid #ccc;display:flex;align-items:center;padding:0 12px;gap:12px;z-index:5}
  /* Hidden with display:none on purpose: the module shows it invisibly for a moment to measure where to fly. */
  #mini{width:40px;height:40px;border:0;background:none;padding:0;display:none}
  #bar.mini-on #mini{display:block}
  .ball{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 36% 30%,#ff9a7c,#e2342a 55%,#8f120d)}
  #big{display:block;width:180px;height:180px;margin:120px auto;border:0;background:none;padding:0}
  #big.flying .ball{opacity:0}
  .landed{animation:pop .4s ease-out}@keyframes pop{40%{transform:scale(1.18)}}
  .mini-alert{animation:alert .9s ease-in-out 2}@keyframes alert{50%{transform:scale(1.25);filter:drop-shadow(0 0 6px #ffb347)}}
  #ping{margin-left:auto;font:13px system-ui,sans-serif}
</style>

<div id="bar"><b>Scroll down</b><button id="mini" aria-label="Press"><div class="ball"></div></button><button id="ping">Make the mini blink</button></div>
<button id="big" aria-label="Press"><div class="ball"></div></button>
<script src="fly-to-mini.js"></script>
<script>
  // Add ?engine=transition to the address to try the browser's View Transitions engine instead of the default flight.
  // 1.2.0 options on: the bar is passed as an element (its height is followed), a little hysteresis, focus follows the visible button, a quick fade under reduced motion.
  var fly = FlyToMini.create({ big: document.getElementById('big'), mini: document.getElementById('mini'), bar: document.getElementById('bar'),
    hysteresis: 0.1, keepFocus: true, reducedFade: true,
    engine: /[?&]engine=transition\b/.test(location.search) ? 'transition' : 'flight',
    onChange: function (on) { document.getElementById('bar').classList.toggle('mini-on', on); } });
  document.getElementById('ping').onclick = function () { fly.alert(); };
</script>
