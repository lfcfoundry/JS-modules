<title>fx-governor demo</title>
<style>body{font:16px system-ui,sans-serif;margin:1rem}#lvl{font-weight:700}.dot{position:absolute;width:20px;height:20px;border-radius:50%;background:#e2564a}</style>
<h1>fx-governor demo</h1><p>Level: <b id="lvl">full</b> · fps <span id="fps">-</span></p><p>Press "Overload" to add heavy work every frame, and watch it step down by itself.</p>
<button id="load">Overload</button> <button id="pick">I choose Full (stop adjusting)</button><div id="dots"></div>
<script src="fx-governor.js"></script>
<script>
  var heavy = false, dots = document.getElementById('dots');
  for (var i = 0; i < 60; i++) { var d = document.createElement('i'); d.className = 'dot'; d.style.left = (i * 12) + 'px'; d.style.top = '160px'; dots.appendChild(d); }
  var gov = FxGovernor.create({ levels: ['full', 'lite', 'calm'], onSample: function (f) { fps.textContent = f.toFixed(0); }, onChange: function (l) { lvl.textContent = l; document.body.dataset.fx = l; } });
  gov.start();
  (function f(t) { if (gov.level === 'full') [].forEach.call(dots.children, function (d, i) { d.style.top = (160 + Math.sin(t / 300 + i) * 40) + 'px'; }); if (heavy && gov.level === 'full') { var x = 0, e = performance.now(); while (performance.now() - e < 40) x++; } requestAnimationFrame(f); })(0);
  load.onclick = function () { heavy = true; }; pick.onclick = function () { gov.choose('full'); lvl.textContent = 'full (chosen)'; heavy = false; };
</script>
