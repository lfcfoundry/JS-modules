<h1>save-kit demo</h1>
<p>Score: <b id="score">0</b> <button id="add">+1</button> <button id="bad">Break the score (NaN)</button> <button id="reset">Reset (tap twice)</button></p>
<p id="msg"></p>
<p><button id="export">Make save code</button> <button id="import">Load code from the box</button></p>
<textarea id="box" placeholder="Save code appears here. Paste a code and press Load."></textarea>
<script src="save-kit.js"></script>
<script>
  var store = SaveKit.create({ key: 'save-kit-demo', prefix: 'DM1',
    schema: { score: 'num', name: 'str:20', owned: 'counts' }, defaults: { score: 0, name: 'player', owned: {} } });
  var state = store.load() || store.validate({});
  function show() { score.textContent = state.score; }
  add.onclick = function () { state.score++; show(); store.save(state); };
  bad.onclick = function () { state.score = NaN; show(); msg.textContent = 'save() returned ' + store.save(state) + ' (a broken number is never written; reload to see the last good value)'; };
  reset.onclick = SaveKit.twoTap(function () { state = store.validate({}); show(); store.save(state); msg.textContent = 'Reset.'; }, 3000, function () { reset.textContent = 'Tap again to erase'; }, function () { reset.textContent = 'Reset (tap twice)'; });
  document.getElementById('export').onclick = function () { store.exportCode(state).then(function (c) { box.value = c; msg.textContent = 'Code made (' + c.length + ' characters).'; }); };
  document.getElementById('import').onclick = function () { store.importCode(box.value).then(function (s) { state = s; show(); store.save(state); msg.textContent = 'Loaded!'; }, function (m) { msg.textContent = m; }); };
  store.autosave(function () { return state; }); show();
  store.onOtherTab(function (other) { store.pause(true); msg.textContent = other ? 'Another tab saved a score of ' + other.score + '. Saving is paused here; reload this page.' : 'Another tab cleared the save. Saving is paused here; reload this page.'; });   // try it: open this page in two tabs and press +1 in one
</script>
