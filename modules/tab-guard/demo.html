<title>tab-guard demo</title>
<style>body{font:16px system-ui,sans-serif;text-align:center;padding:2rem}#s{font-size:1.4rem;padding:1rem;border-radius:.8rem;background:#dfd}body.twin #s{background:#fdd}button{font-size:1.1rem;padding:.6rem 1.2rem;border-radius:.6rem}</style>
<h1>tab-guard demo</h1>
<p>Open this same page in a second tab. Only one tab is "in charge" at a time.</p>
<p id="s">Starting…</p>
<p><button id="go" hidden>Use this tab instead</button></p>
<script src="tab-guard.js"></script>
<script>
  var s = document.getElementById('s'), go = document.getElementById('go');
  function none(why) { document.body.className = ''; go.hidden = true; s.textContent = 'Nothing is guarded here (' + why + '), so saving would simply continue.'; }
  var g = TabGuard.start({
    name: 'tab-guard-demo',
    onClaimed: function () { document.body.className = ''; s.textContent = 'This tab is in charge.'; go.hidden = true; },
    onTwin: function () { document.body.className = 'twin'; s.textContent = 'Another tab is in charge. Saving would be switched off here.'; go.hidden = false; go.disabled = false; },
    onTakeOver: function () { document.body.className = ''; s.textContent = 'This tab took over.'; go.hidden = true; },
    onFree: function () { s.textContent = 'The other tab closed. Use this tab instead?'; go.hidden = false; go.disabled = false; },
    onUnavailable: function (e) { none('the browser said ' + ((e && e.name) || 'no')); }
  });
  if (!g.supported) none(g.reason === 'insecure-context' ? 'this page is not a secure context, for example plain http on a home network' : 'this browser has no Web Locks');
  go.onclick = function () { go.disabled = true; g.takeOver(); };
</script>
