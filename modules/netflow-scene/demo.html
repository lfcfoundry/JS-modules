<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src blob:; style-src 'unsafe-inline'; img-src data:">
<title>netflow-scene demo</title>
<style>body{font:15px system-ui,sans-serif;margin:16px;max-width:900px}svg{width:100%;height:auto;border:1px solid #8884;border-radius:8px}textarea{width:100%;height:5em}footer{margin-top:1.5em;font-size:12px;opacity:.7}</style>
<h1>netflow-scene</h1>
<p>Type links as <code>from to</code>, one per line. The map is laid out by netflow-engine, turned into drawing lists by netflow-scene and drawn as SVG.</p>
<textarea id="t">a b
b c
c a
a d
d e
e b</textarea>
<p id="info"></p>
<div id="out"></div>
<script src="../netflow-engine/netflow-engine.js"></script>
<script src="netflow-scene.js"></script>
<script>
function draw() {
  var ed = [], seen = {}, nodes = [];
  document.getElementById('t').value.split('\n').forEach(function (l) { var p = l.trim().split(/\s+/); if (p.length < 2) return; ed.push({ from: p[0], to: p[1] }); [p[0], p[1]].forEach(function (id) { if (!seen[id]) { seen[id] = 1; nodes.push({ id: id, label: id }); } }); });
  var L = NetflowEngine.build({ nodes: nodes, edges: ed }, { view: 'network', arrange: 'circle' }), S = NetflowScene.make(L, { theme: 'light' });
  document.getElementById('info').textContent = S.dots.length + ' dots, ' + S.curveCount() + ' links, ' + S.labels.length + ' labels';
  document.getElementById('out').innerHTML = NetflowScene.toSvg(S, 'demo');
}
document.getElementById('t').oninput = draw; draw();
</script>
