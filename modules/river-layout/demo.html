<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>river-layout demo</title>
<style>body{font:16px/1.45 system-ui,sans-serif;max-width:56rem;margin:0 auto;padding:1rem}h1{font-size:1.4rem}button,input,select,textarea{font:inherit}button{padding:.5rem .9rem;border-radius:.5rem;cursor:pointer}textarea{width:100%;box-sizing:border-box;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace}.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:.6rem 0}.out{margin:.8rem 0;padding:.6rem .8rem;border:1px solid #8886;border-radius:.5rem;overflow:auto}table{border-collapse:collapse}td,th{padding:.2rem .6rem;border-bottom:1px solid #8884;text-align:right}td:first-child,th:first-child{text-align:left}.note{opacity:.75;font-size:.9rem}.bad{color:#b00020}@media(prefers-color-scheme:dark){.bad{color:#ff8a80}}</style>
<h1>river-layout demo</h1>
<p>One link per line: <code>From &gt; To : amount</code>. The chart redraws as you type. A link that runs backwards (the sample has one) is drawn as a band under the picture.</p>
<textarea id="t" rows="12" spellcheck="false">Wages > Rent : 40
Wages > Food : 25
Wages > Savings : 15
Gifts > Savings : 5
Savings > Holiday : 12
Savings > Rainy day : 8
Food > Eating out : 9
Food > Groceries : 16
Holiday > Wages : 3</textarea>
<p id="msg" class="note"></p><div class="out" id="out"></div>
<script src="river-layout.js"></script>
<script>

var $ = function (id) { return document.getElementById(id); };
function parse(text) {
  var links = [], bad = 0;
  text.split('\n').forEach(function (line) {
    if (!line.trim()) return;
    var m = /^\s*(.+?)\s*>\s*(.+?)\s*:\s*([0-9.]+)\s*$/.exec(line);
    if (m) links.push({ from: m[1], to: m[2], value: +m[3] }); else bad++;
  });
  return { links: links, bad: bad };
}
function draw() {
  var p = parse($('t').value), t0 = performance.now();
  if (!p.links.length) { $('out').innerHTML = ''; $('msg').textContent = 'Type at least one link.'; return; }
  var R = RiverLayout.layoutFlows({ links: p.links }, { height: 360 });
  $('out').innerHTML = RiverLayout.toSvg(R, { title: 'Flow chart' });
  $('msg').textContent = p.links.length + ' links, ' + R.nodes.length + ' items, ' + R.loops.length + ' backward link' + (R.loops.length === 1 ? '' : 's') + ', laid out in ' + (performance.now() - t0).toFixed(0) + ' ms' + (p.bad ? '. ' + p.bad + ' line' + (p.bad === 1 ? '' : 's') + ' skipped (not in the form From > To : amount)' : '') + (R.ignored ? '. ' + R.ignored + ' link' + (R.ignored === 1 ? '' : 's') + ' ignored (to itself or not above 0)' : '') + '.';
}
$('t').oninput = draw; draw();
</script>
