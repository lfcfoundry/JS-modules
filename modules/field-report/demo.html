<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>field-report demo</title>
<body style="font:16px system-ui,sans-serif;margin:1.5rem;max-width:34rem;background:#10131a;color:#eee">
<h1 style="font-size:1.3rem">field-report demo</h1>
<p>Tap the top-left corner of this page <b>5 times quickly</b>. A small panel opens with two buttons: <b>Save speed report</b> and <b>Save error log</b>. Each saves one Markdown file on this device. Nothing is sent anywhere.</p>
<p>Make something happen first, then open the panel:</p>
<p><button id="stutter" style="min-height:44px">Make the page stutter (0.2 s)</button> <button id="boom" style="min-height:44px">Raise an error</button> <button id="reject" style="min-height:44px">Reject a promise</button></p>
<canvas id="c" width="320" height="120" style="width:100%;max-width:320px;border-radius:8px"></canvas>
<script src="field-report.js"></script>
<script>
var fr = FieldReport.start({ name: 'field-report-demo', version: '1.0.0' });
var cv = document.getElementById('c'), cx = cv.getContext('2d'), n = 0;
(function loop() { n++; cx.fillStyle = '#10131a'; cx.fillRect(0, 0, 320, 120); cx.fillStyle = '#6cf'; cx.fillRect(n * 3 % 320, 40, 40, 40); requestAnimationFrame(loop); })();
fr.mark('first-screen');
document.getElementById('stutter').onclick = function () { fr.task('demo-stutter', function () { var t = performance.now(); while (performance.now() - t < 200) {} }); };
document.getElementById('boom').onclick = function () { setTimeout(function () { null.oops(); }, 0); };
document.getElementById('reject').onclick = function () { Promise.reject(new Error('demo rejection')); };
</script>
