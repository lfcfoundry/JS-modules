<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LFC-pack viewer</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<style>:root{--bg:#fff;--fg:#1a1a1a;--mut:#5c5c5c;--line:#c9c9c9;--acc:#0b5cad;--card:#f4f6f8}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--mut:#aaa;--line:#444;--acc:#6db3f2;--card:#202327}}
*{box-sizing:border-box}body{font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:1rem 16px;max-width:64rem;margin-inline:auto}
h1{font-size:1.4rem;margin:.2rem 0}h2{font-size:1.05rem;margin:1.2rem 0 .4rem}p{margin:.3rem 0}.mut{color:var(--mut)}
#drop{border:2px dashed var(--line);border-radius:10px;padding:1.2rem;text-align:center;margin:.8rem 0}#drop.over{border-color:var(--acc);background:var(--card)}
button,label.btn{font:inherit;padding:.45rem .8rem;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);cursor:pointer;display:inline-block}
button:disabled{opacity:.5;cursor:default}input[type=file]{position:absolute;left:-9999px}label.btn:focus-within,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.6rem}.card{background:var(--card);border-radius:8px;padding:.5rem .7rem}.card b{display:block;font-size:1.15rem}
pre{background:var(--card);border-radius:8px;padding:.6rem;overflow:auto;max-height:16rem;font:13px/1.4 ui-monospace,monospace;margin:.3rem 0}
.wrap{overflow:auto;max-height:26rem;border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;font:13px/1.4 ui-monospace,monospace;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:.2rem .5rem;text-align:left;white-space:nowrap;max-width:24rem;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;background:var(--card)}
#err{color:#b00020;font-weight:600}@media (prefers-color-scheme:dark){#err{color:#ff8a80}}</style></head><body>
<h1>LFC-pack viewer</h1>
<p class="mut">Opens a <code>.json.lfc</code> file on this device and shows what is in it. Nothing is sent anywhere: the page makes no network calls and keeps nothing after you close it.</p>
<div id="drop"><p>Drop a <code>.json.lfc</code> file here, or</p><p><label class="btn" id="pick">Choose a file<input type="file" id="file" accept=".lfc,.json.lfc,application/octet-stream"></label></p></div>
<p id="err" role="alert"></p>
<div id="out" hidden>
<h2>File</h2><div class="cards" id="cards"></div>
<h2>Metadata</h2><pre id="meta"></pre>
<div id="tabsec"><h2>Tables</h2><p id="tabs"></p></div>
<h2>First rows <span class="mut" id="shown"></span></h2><div class="wrap"><table id="tbl"></table></div>
<p style="margin-top:.8rem"><button id="dl">Save all rows as NDJSON</button> <span class="mut" id="dlnote"></span></p>
</div>
