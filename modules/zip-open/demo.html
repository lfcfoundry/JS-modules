<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>zip-open demo</title>
<style>body{font:16px/1.45 system-ui,sans-serif;max-width:56rem;margin:0 auto;padding:1rem}h1{font-size:1.4rem}button,input,select,textarea{font:inherit}button{padding:.5rem .9rem;border-radius:.5rem;cursor:pointer}textarea{width:100%;box-sizing:border-box;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace}.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:.6rem 0}.out{margin:.8rem 0;padding:.6rem .8rem;border:1px solid #8886;border-radius:.5rem;overflow:auto}table{border-collapse:collapse}td,th{padding:.2rem .6rem;border-bottom:1px solid #8884;text-align:right}td:first-child,th:first-child{text-align:left}.note{opacity:.75;font-size:.9rem}.bad{color:#b00020}@media(prefers-color-scheme:dark){.bad{color:#ff8a80}}</style>
<h1>zip-open demo</h1>
<p>Drop a .zip or an Excel .xlsx file here (it never leaves your device) or pick one of the samples. Text files come out as text, every Excel sheet comes out as CSV, and anything unsafe is skipped with a note in plain words.</p>
<div class="row"><input id="f" type="file" accept=".zip,.xlsx,.xlsm"><button id="s1">Sample zip</button><button id="s2">Zip bomb (claims 1 KB, holds 64 MB)</button></div>
<div class="out" id="out">Nothing opened yet.</div>
<script src="zip-open.js"></script>
<script>

var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function show(r, ms, name) {
  var h = '<b>' + esc(name) + '</b>: ' + r.files.length + ' file' + (r.files.length === 1 ? '' : 's') + ' read in ' + ms.toFixed(0) + ' ms';
  r.files.slice(0, 20).forEach(function (f) { h += '<p><b>' + esc(f.path) + '</b> (' + f.text.length + ' characters)<br><code>' + esc(f.text.slice(0, 160)).replace(/\n/g, '<br>') + (f.text.length > 160 ? ' …' : '') + '</code></p>'; });
  if (r.notes.length) h += '<p class="note">Notes:<br>' + r.notes.map(esc).join('<br>') + '</p>';
  $('out').innerHTML = h;
}
function fail(e) { $('out').innerHTML = '<span class="bad">' + esc(e && e.message || e) + '</span>'; }
function open(bytes, name) { var t0 = performance.now(); ZipOpen.expand(bytes, name).then(function (r) { show(r, performance.now() - t0, name); }, fail); }
$('f').onchange = function () { var f = this.files[0]; if (f) f.arrayBuffer().then(function (b) { open(new Uint8Array(b), f.name); }); };
function enc(s) { return new TextEncoder().encode(s); }
function le(n, v, o, b) { for (var i = 0; i < n; i++) b[o + i] = (v >>> (8 * i)) & 255; }
function makeZip(files) {   // files: { name, raw (bytes as stored), method, crc, usize }; a tiny writer for this demo
  var parts = [], cd = [], off = 0;
  files.forEach(function (f) {
    var nm = enc(f.name), lh = new Uint8Array(30 + nm.length), ch = new Uint8Array(46 + nm.length);
    le(4, 0x04034b50, 0, lh); le(2, 20, 4, lh); le(2, 0x800, 6, lh); le(2, f.method, 8, lh); le(4, f.crc, 14, lh); le(4, f.raw.length, 18, lh); le(4, f.usize, 22, lh); le(2, nm.length, 26, lh); lh.set(nm, 30);
    le(4, 0x02014b50, 0, ch); le(2, 20, 4, ch); le(2, 20, 6, ch); le(2, 0x800, 8, ch); le(2, f.method, 10, ch); le(4, f.crc, 16, ch); le(4, f.raw.length, 20, ch); le(4, f.usize, 24, ch); le(2, nm.length, 28, ch); le(4, off, 42, ch); ch.set(nm, 46);
    parts.push(lh, f.raw); cd.push(ch); off += lh.length + f.raw.length;
  });
  var cl = cd.reduce(function (a, c) { return a + c.length; }, 0), end = new Uint8Array(22);
  le(4, 0x06054b50, 0, end); le(2, files.length, 8, end); le(2, files.length, 10, end); le(4, cl, 12, end); le(4, off, 16, end);
  var all = parts.concat(cd, [end]), out = new Uint8Array(off + cl + 22), p = 0; all.forEach(function (a) { out.set(a, p); p += a.length; }); return out;
}
$('s1').onclick = function () {
  var a = enc('name,score\nAda,10\nBo,7\n'), b = enc('# Notes\nHello from inside a zip.\n'), c = new Uint8Array([0, 1, 2, 3, 255, 254]);
  open(makeZip([{ name: 'data/scores.csv', raw: a, method: 0, crc: ZipOpen.crc32(a), usize: a.length }, { name: 'notes.md', raw: b, method: 0, crc: ZipOpen.crc32(b), usize: b.length }, { name: 'logo.bin', raw: c, method: 0, crc: ZipOpen.crc32(c), usize: c.length }]), 'sample.zip');
};
$('s2').onclick = function () {
  if (typeof CompressionStream === 'undefined') return fail(new Error('This browser has no CompressionStream, so it cannot build the bomb.'));
  $('out').textContent = 'Building 64 MB of zeros, squeezed…';
  var zeros = new Uint8Array(64 * 1048576), cs = new CompressionStream('deflate-raw'), w = cs.writable.getWriter(); w.write(zeros); w.close();
  new Response(cs.readable).arrayBuffer().then(function (ab) {
    var raw = new Uint8Array(ab);
    open(makeZip([{ name: 'big.csv', raw: raw, method: 8, crc: 0, usize: 1000 }]), 'bomb.zip');
  }, fail);
};
</script>
